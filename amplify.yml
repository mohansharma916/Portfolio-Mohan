version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - env | grep -E '^(OPENAI_API_KEY|GITHUB_TOKEN|RAZORPAY)' >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
    exclude:
      - 'cache/**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
